# Every player-facing line, chat and menu. '&' colour codes and &#RRGGBB hex work everywhere.
# A blank chat message is not sent. Keys missing from this file fall back to the plugin's defaults.

prefix: "&5Enchanting &8» &r"

no-permission: "&cYou can't use enchanting tables."
no-permission-admin: "&cYou don't have permission to do that."
usage: "&7Usage: &f/%label% reload"
reloaded: "&aRoyalEnchanting reloaded: &f%enchants%&a enchants in the table."

books-not-allowed: "&cBooks can't be enchanted at the table."
item-dropped: "&eYour inventory was full, so your item was dropped at your feet."

applied: "&aYou enchanted your item with &d%enchant%&a for &3%xp% Exp Levels&a."
removed: "&aYou removed &d%enchant%&a from your item for &3%xp% Exp Levels&a and &9%lapis% Lapis Lazuli&a."

fail-skill: "&cYou need &5Enchanting %required%&c for that enchantment."
fail-bookshelf-power: "&cThis table needs &d%required% Bookshelf Power&c for that enchantment."
fail-xp: "&cYou need &3%required% Exp Levels&c."
refund-xp: "&aReimbursement! &7You got your &3%xp% Exp Levels&7 back."
refund-lapis: "&aOvercompensation! &7You got your &9%lapis% Lapis Lazuli&7 back."
fail-lapis: "&cYou need &9%required% Lapis Lazuli&c."
fail-higher-level: "&cYour item already has a higher level of that enchantment."
fail-above-max: "&cThat enchantment is above the table's maximum level and can't be changed here."
fail-incompatible: "&cThat enchantment can't be combined with your item's other enchantments."
fail-not-applicable: "&cThat enchantment can't go on this item."

gui:
  title: "&8Enchant Item"

  enchant-item:
    name: "&aEnchant Item"
    lore:
      - "&7Add the item you want to enchant"
      - "&7to the slot above."
      - ""
      - "&7Choose an enchantment and a level"
      - "&7to apply it; choose the level the"
      - "&7item already has to remove it."
  no-item:
    name: "&cEnchant Item"
    lore:
      - "&7Place an item in the open slot"
      - "&7to enchant it!"
  no-enchants:
    name: "&cNo Enchantments"
    lore:
      - "&7This item can't be enchanted"
      - "&7at the table."
  bookshelf:
    name: "&dBookshelf Power"
    lore:
      - "&7Stronger enchantments need more"
      - "&7bookshelves around the table."
      - ""
      - "&7Current Power: &d%power%&8/%max%"
      - "&7Your Enchanting level: &5%skill%"
      - ""
      - "&8Bookshelves count one block away from"
      - "&8the table, on its level or one above."
  close:
    name: "&cClose"
    lore: []
  back:
    name: "&aGo Back"
    lore:
      - "&7To Enchant Item"
  previous-page:
    name: "&aPrevious Page"
    lore:
      - "&ePage %page%"
  next-page:
    name: "&aNext Page"
    lore:
      - "&ePage %page%"
  sort:
    name: "&aSort"
    lore:
      - ""
    modes:
      default: "Default"
      missing_first: "Missing first"
      a_to_z: "A to Z"
      z_to_a: "Z to A"
    selected: "&b> %mode%"
    unselected: "&7%mode%"
    click: "&eClick to switch sort!"

  enchant:
    name: "&a%enchant%"
    name-locked: "&c%enchant%"
    description-line: "&7%line%"
    current: "&7On this item: &a%enchant% %level%"
    current-none: "&8Not on this item"
    max-level: "&7Table max level: &f%max%"
    replaces: "&cReplaces %enchant% %level%"
    click: "&eClick to view!"
    click-locked: "&cRequirements not met!"

  requirements:
    header: "&7Requirements:"
    skill-met: " &a✔ &7Enchanting &5%required%"
    skill-missing: " &c✖ &7Enchanting &5%required% &8(you: %current%)"
    power-met: " &a✔ &d%required% &7Bookshelf Power"
    power-missing: " &c✖ &d%required% &7Bookshelf Power &8(table: %current%)"

  level:
    name: "&9%enchant% %level%"
    name-remove: "&a%enchant% %level% &8(on item)"
    name-unavailable: "&7%enchant% %level%"
    cost:
      - "&7Cost"
      - "&3%xp% Exp Levels"
    status-apply: "&eClick to enchant!"
    status-remove: "&eClick to remove!"
    status-no-xp: "&cNot enough Exp Levels!"
    status-no-lapis: "&cNot enough Lapis Lazuli!"
    status-locked: "&cRequirements not met!"
    status-higher-level: "&cYour item has a higher level!"
    status-above-max: "&cAbove the table's max level!"
