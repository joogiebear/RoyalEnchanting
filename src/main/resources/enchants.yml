# The enchants the table offers, in the menu's default order. Anything not listed here is not offered.
#
#   <id>:                  the enchant's key; EcoEnchants enchants and vanilla ones are both minecraft:<id>
#     name:                shown in the menu
#     skill-level:         Enchanting skill level needed (EcoSkills)
#     bookshelf-power:     Bookshelf Power the table needs (0-20)
#     max-level:           optional cap below the enchant's own maximum
#     enabled:             optional, false hides the entry
#
# An enchant only appears for items it can go on (its EcoEnchants targets, or vanilla's rules), and
# never above its own max-level or the number of levels priced in config.yml.
# Fortune, Looting and Luck of the Sea are never offered, even if listed.
#
# On RoyalSkyblock this file is generated by rsb-content generators/gen_p2_enchant_table.py.

